<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "NotoKufi";
        src: url("../../src/fonts/NotokufiArabic-Bold.ttf") format("truetype");
        font-weight: 700;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1024px; height: 500px; overflow: hidden; }
      body {
        font-family: "NotoKufi", sans-serif;
        background:
          radial-gradient(circle at 18% 30%, #157d68 0%, transparent 45%),
          radial-gradient(circle at 90% 90%, #0a4f42 0%, transparent 55%),
          linear-gradient(135deg, #0e6f5c 0%, #0a4f42 100%);
        color: #fff;
        position: relative;
      }
      .rings { position: absolute; inset: 0; overflow: hidden; }
      .ring {
        position: absolute; border: 2px solid rgba(255,255,255,.10);
        border-radius: 50%;
      }
      .r1 { width: 520px; height: 520px; left: -180px; top: -170px; }
      .r2 { width: 340px; height: 340px; left: -90px; top: -80px; }
      .r3 { width: 760px; height: 760px; left: -300px; top: -290px; }
      .dots {
        position: absolute; inset: 0;
        background-image: radial-gradient(rgba(255,255,255,.14) 1.5px, transparent 1.6px);
        background-size: 26px 26px;
        mask-image: linear-gradient(to left, rgba(0,0,0,.7), transparent 60%);
      }
      .content {
        position: relative; height: 100%;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 78px;
      }
      .icon-wrap {
        width: 240px; height: 240px;
        background: #fff;
        border-radius: 52px;
        padding: 12px;
        box-shadow: 0 22px 55px rgba(0,0,0,.32);
        flex: none;
      }
      .icon-wrap img { width: 100%; height: 100%; border-radius: 42px; }
      .text { text-align: right; }
      .pill {
        display: inline-block;
        border: 1.5px solid rgba(255,255,255,.45);
        background: rgba(255,255,255,.10);
        border-radius: 999px;
        padding: 7px 22px;
        font-size: 20px;
        letter-spacing: .5px;
        margin-bottom: 18px;
      }
      h1 {
        font-size: 84px; line-height: 1.05; font-weight: 700;
        text-shadow: 0 4px 18px rgba(0,0,0,.25);
      }
      .sub {
        margin-top: 16px; font-size: 25px; line-height: 1.6;
        color: rgba(255,255,255,.92);
      }
      .rule {
        margin-top: 22px; width: 150px; height: 5px; border-radius: 3px;
        background: #f0c96a; margin-right: 0; margin-left: auto;
      }
      .byline {
        position: absolute; bottom: 26px; left: 78px;
        font-size: 18px; color: rgba(255,255,255,.65);
      }
    </style>
  </head>
  <body>
    <div class="rings">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
    </div>
    <div class="dots"></div>
    <div class="content">
      <div class="text">
        <div class="pill">تطبيق أندرويد</div>
        <h1>منصة دروسي</h1>
        <div class="sub">التخصصات · مخططات ومذكرات الدروس<br />الدليل البيداغوجي للمتربص</div>
        <div class="rule"></div>
      </div>
      <div class="icon-wrap">
        <img src="../../public/icons/icon-512.png" alt="" />
      </div>
    </div>
    <div class="byline">منصة دروسي · أندرويد</div>
  </body>
</html>
